<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="icon" href="icons/icon-192.png">

<title>Карточки слов</title>
<meta name="theme-color" content="#eef0fb">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Layout: one-column phone app, sticky header, bottom tab bar, cards as soft pastel surfaces */
:root{
  --bg:#eef0fb; --surface:#ffffff; --surface2:#e4e7fa; --fg:#2b2d57; --muted:#767bab;
  --accent:#7b82e6; --accent2:#a58bf5; --accent-ink:#ffffff; --line:#d9dcf3;
  --bad:#e5484d; --bad-bg:#fde6e7; --ok:#25a06a; --ok-bg:#dff5ea; --stop:#ee8a1f; --stop-bg:#fdeed9;
  --shadow:0 6px 22px rgba(95,100,190,.14);
  --font-display:'Fredoka','Nunito',system-ui,sans-serif; --font-body:'Nunito',system-ui,sans-serif;
  --grad:linear-gradient(135deg,#8fa0f5,#b49af7);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d0b14; --surface:#171321; --surface2:#221b33; --fg:#ece8fa; --muted:#9b90c2;
  --accent:#a58bf5; --accent2:#7c6cf0; --accent-ink:#120d22; --line:#2c2342;
  --bad:#ff6b70; --bad-bg:#3a1a24; --ok:#4ad694; --ok-bg:#12301f; --stop:#ffa24a; --stop-bg:#3a2810;
  --shadow:0 6px 22px rgba(0,0,0,.45); --grad:linear-gradient(135deg,#7c6cf0,#a58bf5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d0b14; --surface:#171321; --surface2:#221b33; --fg:#ece8fa; --muted:#9b90c2;
  --accent:#a58bf5; --accent2:#7c6cf0; --accent-ink:#120d22; --line:#2c2342;
  --bad:#ff6b70; --bad-bg:#3a1a24; --ok:#4ad694; --ok-bg:#12301f; --stop:#ffa24a; --stop-bg:#3a2810;
  --shadow:0 6px 22px rgba(0,0,0,.45); --grad:linear-gradient(135deg,#7c6cf0,#a58bf5); color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:10px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:10px;padding:14px 0 10px}
header.top h1{font-family:var(--font-display);font-weight:600;font-size:24px;margin:0;flex:1;letter-spacing:.2px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.icon-btn{width:42px;height:42px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;font-size:20px;color:var(--accent)}
main{flex:1;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;
  padding:8px max(12px,env(safe-area-inset-left,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));
  background:linear-gradient(to top,var(--bg) 70%,transparent)}
nav.tabs .bar{display:flex;gap:4px;width:100%;max-width:560px;background:var(--surface);border-radius:22px;padding:6px;box-shadow:var(--shadow)}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px;border-radius:16px;font-size:12px;font-weight:700;color:var(--muted)}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{background:var(--grad);color:var(--accent-ink)}
h2{font-family:var(--font-display);font-weight:600;font-size:20px;margin:8px 0 12px}
.sub{color:var(--muted);font-size:14px;margin:-6px 0 14px}
.card{background:var(--surface);border-radius:20px;padding:14px 16px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row>.grow{flex:1;min-width:0}
.wrap{flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:16px;font-weight:800;background:var(--grad);color:var(--accent-ink);box-shadow:var(--shadow)}
.btn.soft{background:var(--surface2);color:var(--accent);box-shadow:none}
.btn.danger{background:var(--bad-bg);color:var(--bad);box-shadow:none}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.chip{padding:8px 14px;border-radius:999px;background:var(--surface);color:var(--muted);font-weight:700;font-size:14px;box-shadow:var(--shadow)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
input[type=text],textarea,select{width:100%;padding:12px 14px;border-radius:14px;border:2px solid var(--line);background:var(--surface);outline:0}
input[type=text]:focus,textarea:focus{border-color:var(--accent)}
label.f{display:block;font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px}
.item{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:18px;padding:12px 14px;box-shadow:var(--shadow)}
.item .w{flex:1;min-width:0}
.item .w b{display:block;overflow-wrap:anywhere}
.item .w span{display:block;color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:800}
.pill.bad{background:var(--bad-bg);color:var(--bad)} .pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.stop{background:var(--stop-bg);color:var(--stop)}
.pill.neutral{background:var(--surface2);color:var(--muted)}
.mark{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.mark.bad{background:var(--bad-bg);color:var(--bad)} .mark.ok{background:var(--ok-bg);color:var(--ok)} .mark.stop{background:var(--stop-bg);color:var(--stop)}
.empty{text-align:center;color:var(--muted);padding:34px 12px}
.check{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}
.sheet-bg{position:fixed;inset:0;background:rgba(20,16,40,.45);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92%;display:flex;flex-direction:column;overflow:hidden;border-radius:26px 26px 0 0}
.sheet-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:18px 16px 12px}
.sheet-body:last-child{padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
.sheet-foot{display:flex;flex-direction:column;gap:8px;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--bg)}
.clr{position:relative}
.clr input{padding-right:42px}
.clr .x{position:absolute;right:7px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;background:var(--surface2);color:var(--muted);display:none;place-items:center;font-size:13px;font-weight:800}
.clr.has .x{display:grid}
.warn{margin-top:6px;padding:8px 12px;border-radius:12px;background:var(--bad-bg);color:var(--bad);font-weight:700;font-size:14px;overflow-wrap:anywhere}
input.is-dup{border-color:var(--bad)!important}
.check.compact{padding:8px 12px;gap:10px;border-radius:14px;box-shadow:none;background:var(--surface)}
.catbox{max-height:272px;overflow:auto;padding:2px;display:flex;flex-direction:column;gap:6px;border-radius:16px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;min-width:0}
.two>div{min-width:0}
.plist{display:flex;flex-direction:column;gap:6px;max-height:46vh;overflow:auto;padding:2px}
.pi{display:flex;align-items:center;gap:6px;width:100%;text-align:left;padding:8px 10px;border-radius:12px;background:var(--surface);font-size:14px;line-height:1.25}
.pi .t{flex:1;min-width:0;overflow-wrap:anywhere}
.pi .t b{display:block}.pi .t span{color:var(--muted);display:block}
.pi .m{flex:none;font-weight:800;color:var(--muted)}
.pi.in{background:var(--ok-bg)} .pi.in .m{color:var(--ok)}
.cap{font-size:13px;font-weight:800;color:var(--muted);margin:0 0 6px}
.brow{background:var(--surface);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.brow .in{display:grid;grid-template-columns:1fr auto 1fr auto;gap:6px;align-items:center}
.brow .in input{padding:10px 10px;min-width:0}
.brow .dash{color:var(--muted);font-weight:800}
.brow .del{width:30px;height:30px;border-radius:50%;background:var(--surface2);color:var(--muted);font-size:13px;font-weight:800}
.brow .catbtn{text-align:left;font-size:13px;font-weight:700;color:var(--accent);padding:2px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips .chip{padding:6px 11px;font-size:13px;box-shadow:none;background:var(--surface2)}
.chips .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.cnt{width:84px!important;text-align:center}
.stage,.q{position:relative}
.pencil{position:absolute;right:12px;bottom:12px;width:38px;height:38px;border-radius:50%;background:var(--surface2);color:var(--accent);z-index:6;display:grid;place-items:center;font-size:17px;font-weight:800}
.q .pencil{bottom:10px}

.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:14px;font-weight:700;z-index:60;font-size:14px}
/* study */
.progress{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}
.progress i{display:block;height:100%;background:var(--grad);transition:width .25s}
.stage{position:relative;height:min(52vh,380px);margin:16px 0;perspective:1200px;touch-action:pan-y}
.flip{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.7,.3,1),box-shadow .2s;cursor:grab;user-select:none}
.flip.is-flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:28px;background:var(--surface);box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:2px solid var(--line)}
.face.back{transform:rotateY(180deg);background:var(--surface2)}
.face .txt{font-family:var(--font-display);font-weight:500;font-size:clamp(26px,8vw,38px);overflow-wrap:anywhere;line-height:1.2}
.face .hint{position:absolute;bottom:16px;font-size:13px;color:var(--muted);font-weight:700}
.face .lang{position:absolute;top:16px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drag-wrap{position:absolute;inset:0;transition:transform .25s}
.badge-over{position:absolute;top:18px;z-index:3;width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;opacity:0;pointer-events:none}
.badge-over.l{left:18px;background:var(--bad-bg);color:var(--bad)} .badge-over.r{right:18px;background:var(--ok-bg);color:var(--ok)}
.actions{display:flex;justify-content:center;gap:18px}
.round{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:800;box-shadow:var(--shadow)}
.round.bad{background:var(--bad-bg);color:var(--bad)} .round.ok{background:var(--ok-bg);color:var(--ok)} .round.stop{background:var(--stop-bg);color:var(--stop);width:52px;height:52px;align-self:center;font-size:22px}
.q{background:var(--surface);border-radius:26px;padding:34px 20px;text-align:center;box-shadow:var(--shadow);margin:16px 0;border:2px solid var(--line)}
.q .txt{font-family:var(--font-display);font-size:clamp(26px,8vw,36px);overflow-wrap:anywhere;line-height:1.2}
.q .lang{display:block;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.opt{width:100%;text-align:left;padding:14px 16px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);font-weight:700;border:2px solid transparent;overflow-wrap:anywhere}
.opt.right{background:var(--ok-bg);color:var(--ok);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);color:var(--bad);border-color:var(--bad)}
.feedback{padding:12px 14px;border-radius:16px;font-weight:700;overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-bg);color:var(--ok)} .feedback.bad{background:var(--bad-bg);color:var(--bad)}
.bar-row{display:flex;align-items:center;gap:10px}
.bar-track{flex:1;height:12px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:99px}
.num{font-variant-numeric:tabular-nums}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi .card{text-align:center;padding:12px 6px}
.kpi b{display:block;font-family:var(--font-display);font-size:28px}
.kpi span{font-size:12px;color:var(--muted);font-weight:700}
.spark{display:flex;align-items:flex-end;gap:6px;height:90px}
.spark div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:11px;color:var(--muted)}
.spark i{width:100%;border-radius:8px 8px 4px 4px;background:var(--grad);min-height:3px}
@media (min-width:700px){#app{max-width:720px}nav.tabs .bar{max-width:720px}.sheet{max-width:720px}}
@media (orientation:landscape) and (max-height:560px){
  header.top{padding:8px 0 6px}
  main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .stage{height:min(40vh,250px);margin:6px 0}
  .q{padding:16px;margin:8px 0}
  .face .txt{font-size:clamp(22px,5vw,32px)}
  .round{width:46px;height:46px;font-size:22px}.round.stop{width:40px;height:40px;font-size:18px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:6px;padding:6px 2px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>
<div id="app">
  <header class="top">
    <h1 id="title">Карточки</h1>
    <button class="icon-btn" id="btnTheme" aria-label="Сменить тему" title="Тема">◐</button>
    <button class="icon-btn" id="btnMenu" aria-label="Данные и резервная копия" title="Резервная копия">⋯</button>
  </header>
  <main id="view"></main>
  <nav class="tabs" aria-label="Разделы"><div class="bar" role="tablist" id="tabs"></div></nav>
</div>
<div id="layer"></div>
<script>
/* ---------- Хранилище: IndexedDB, без ограничений по количеству ---------- */
const DB_NAME='flashcards-v1';
let _db=null, memMode=false;
const mem={cards:new Map(),cats:new Map(),events:new Map(),meta:new Map()};
function openDB(){
  return new Promise((res)=>{
    try{
      const r=indexedDB.open(DB_NAME,1);
      r.onupgradeneeded=()=>{const d=r.result;
        ['cards','cats','events'].forEach(n=>d.createObjectStore(n,{keyPath:'id'}));
        d.createObjectStore('meta',{keyPath:'k'});};
      r.onsuccess=()=>{_db=r.result;res(true)};
      r.onerror=()=>{memMode=true;res(false)};
      r.onblocked=()=>{memMode=true;res(false)};
    }catch(e){memMode=true;res(false)}
  });
}
function tx(store,mode,fn){return new Promise((res,rej)=>{
  const t=_db.transaction(store,mode);const s=t.objectStore(store);const out=fn(s);
  t.oncomplete=()=>res(out&&out.result!==undefined?out.result:undefined);t.onerror=()=>rej(t.error);});}
const keyOf=(store)=>store==='meta'?'k':'id';
async function dbAll(store){
  if(memMode)return [...mem[store].values()];
  return new Promise((res,rej)=>{const r=_db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
}
async function dbPut(store,obj){
  if(memMode){mem[store].set(obj[keyOf(store)],obj);return}
  return tx(store,'readwrite',s=>s.put(obj));
}
async function dbPutMany(store,arr){
  if(memMode){arr.forEach(o=>mem[store].set(o[keyOf(store)],o));return}
  return tx(store,'readwrite',s=>{arr.forEach(o=>s.put(o))});
}
async function dbDel(store,id){
  if(memMode){mem[store].delete(id);return}
  return tx(store,'readwrite',s=>s.delete(id));
}
async function dbClear(store){
  if(memMode){mem[store].clear();return}
  return tx(store,'readwrite',s=>s.clear());
}

/* ---------- Состояние ---------- */
const S={cards:[],cats:[],events:[],meta:{theme:'auto',frontLang:'Иностранный',seeded:false},
  tab:'cards',cardFilter:'all',query:'',study:null,drafts:{},folders:[],collapsed:new Set(),cycle:{classic:[],choice:[],write:[],chain:[]}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const $=(s,r=document)=>r.querySelector(s);
const esc=(s)=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const byId=(arr,id)=>arr.find(x=>x.id===id);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const dayKey=(t)=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),1800)}
const norm=(s)=>String(s).normalize('NFKC').toLowerCase().replace(/ё/g,'е').replace(/[.,!?;:"«»()。、，！？「」『』（）・]/g,' ').replace(/\s+/g,' ').trim();
/* несколько вариантов в одной строке: запятая, точка с запятой, косая черта, японская запятая */
const splitVariants=(t)=>String(t).split(/[,;\/、，；／]/).map(x=>x.trim()).filter(Boolean);
const variantKeys=(t)=>splitVariants(t).map(norm).filter(Boolean);
/* карточка с таким же иностранным словом (любой из вариантов) */
function findDup(front,excludeId,extra){
  const keys=new Set(variantKeys(front));if(!keys.size)return null;
  for(const c of S.cards){if(c.id===excludeId)continue;if(variantKeys(c.front).some(k=>keys.has(k)))return c}
  if(extra)for(const c of extra){if(variantKeys(c.front).some(k=>keys.has(k)))return c}
  return null;
}
/* кнопка ✕ в поле ввода */
function clearable(inp){
  const w=document.createElement('div');w.className='clr';inp.parentNode.insertBefore(w,inp);w.appendChild(inp);
  const b=document.createElement('button');b.type='button';b.className='x';b.textContent='✕';b.setAttribute('aria-label','Очистить поле');w.appendChild(b);
  const upd=()=>w.classList.toggle('has',!!inp.value);
  inp.addEventListener('input',upd);
  b.addEventListener('click',()=>{inp.value='';upd();inp.dispatchEvent(new Event('input',{bubbles:true}));inp.focus()});
  upd();return w;
}
/* Enter во время ввода через IME (японский) только подтверждает слово */
const isIME=(e)=>e.isComposing||e.keyCode===229;
/* черновики незаконченных карточек, переживают закрытие окна и перезагрузку */
let _dt=null;
function saveDraft(key,val){
  S.drafts[key]=val;clearTimeout(_dt);
  _dt=setTimeout(()=>{dbPut('meta',{k:'drafts',...S.drafts}).catch(()=>{})},250);
}
function clearDraft(key){delete S.drafts[key];dbPut('meta',{k:'drafts',...S.drafts}).catch(()=>{})}


/* статистика по карточке из журнала событий */
function cardStats(){
  const m=new Map();
  for(const e of S.events){
    let s=m.get(e.c);if(!s){s={ok:0,bad:0,last:null,lastT:0};m.set(e.c,s)}
    s[e.r==='ok'?'ok':'bad']++; if(e.t>=s.lastT){s.last=e.r;s.lastT=e.t}
  }
  return m;
}
async function logEvent(cardId,result){
  const ev={id:uid(),c:cardId,r:result,t:Date.now()};
  S.events.push(ev);await dbPut('events',ev);return ev;
}

/* ---------- Папки категорий ---------- */
const saveFolders=()=>dbPut('meta',{k:'folders',list:S.folders}).catch(()=>{});
function groupedCats(){
  const out=S.folders.map(f=>({folder:f,cats:S.cats.filter(k=>k.folderId===f.id)}));
  const loose=S.cats.filter(k=>!k.folderId||!byId(S.folders,k.folderId));
  if(loose.length||!S.folders.length)out.push({folder:null,cats:loose});
  return out;
}
/* чипы категорий, сгруппированные по папкам; on(id) решает, нажат ли чип */
function catChips(on){
  const groups=groupedCats(),multi=S.folders.length>0;
  return groups.filter(g=>g.cats.length).map(g=>(multi?`<div class="cap" style="flex-basis:100%;margin:4px 0 0">${g.folder?esc(g.folder.name):'Без папки'}</div>`:'')+
    g.cats.map(k=>`<button type="button" class="chip" data-c="${k.id}" aria-pressed="${on(k.id)}">${esc(k.name)}</button>`).join('')).join('');
}
/* ---------- Тема ---------- */
function applyTheme(){
  const r=document.documentElement;
  if(S.meta.theme==='light')r.setAttribute('data-theme','light');
  else if(S.meta.theme==='dark')r.setAttribute('data-theme','dark');
  else r.removeAttribute('data-theme');
  const dark=S.meta.theme==='dark'||(S.meta.theme==='auto'&&matchMedia('(prefers-color-scheme:dark)').matches);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=dark?'#0d0b14':'#eef0fb';
}
async function cycleTheme(){
  const order=['auto','light','dark'];
  S.meta.theme=order[(order.indexOf(S.meta.theme)+1)%3];
  applyTheme();await dbPut('meta',{k:'meta',...S.meta});
  toast({auto:'Тема: как в системе',light:'Тема: светлая',dark:'Тема: тёмная'}[S.meta.theme]);
}
/* ---------- Окна ---------- */
function openSheet(html,onMount,foot){
  closeSheet();
  const bg=document.createElement('div');bg.className='sheet-bg';bg.id='sheetBg';
  bg.innerHTML='<div class="sheet" role="dialog" aria-modal="true"><div class="sheet-body">'+html+'</div>'+(foot?'<div class="sheet-foot">'+foot+'</div>':'')+'</div>';
  /* окно закрывается только если и нажатие, и отпускание были на затемнении:
     выделение текста мышью с выходом за край окна его больше не закрывает */
  let down=false;
  bg.addEventListener('pointerdown',e=>{down=(e.target===bg)});
  bg.addEventListener('click',e=>{if(e.target===bg&&down)closeSheet();down=false});
  $('#layer').appendChild(bg);onMount&&onMount(bg.firstChild);
}
function closeSheet(){const b=$('#sheetBg');if(b)b.remove();S.afterEdit=null}
/* после правки карточки из режима обучения вызывается его обработчик, иначе обычная перерисовка */
function finishEdit(){const f=S.afterEdit;closeSheet();if(f)f();else render()}

/* ---------- Вкладка: карточки ---------- */
function viewCards(){
  const v=$('#view');
  v.innerHTML=`
    <div style="margin-bottom:10px"><input type="text" id="q" placeholder="Поиск по карточкам" value="${esc(S.query)}" aria-label="Поиск" autocomplete="off"></div>
    <div class="row" style="margin-bottom:10px"><button class="btn grow" id="addCard">＋ Карточка</button><button class="btn soft grow" id="addMany">＋ Несколько карточек</button></div>
    <div class="row wrap" id="chipsRow" style="margin-bottom:14px"></div>
    <div class="stack" id="cardList"></div>`;
  clearable($('#q'));
  /* поле поиска не перерисовывается при вводе, иначе ломается ввод через IME (японский) */
  $('#q').addEventListener('input',e=>{S.query=e.target.value;drawCardList()});
  $('#addCard').onclick=()=>editCard();
  $('#addMany').onclick=()=>editMany();
  drawCardList();
}
function drawCardList(){
  const st=cardStats();
  const inCat=new Set();S.cats.forEach(k=>k.cardIds.forEach(i=>inCat.add(i)));
  const nocat=S.cards.filter(c=>!inCat.has(c.id));
  let list=S.cards.slice().sort((a,b)=>b.created-a.created);
  if(S.cardFilter==='stop')list=list.filter(c=>c.stop);
  else if(S.cardFilter==='nocat')list=list.filter(c=>!inCat.has(c.id));
  const q=norm(S.query);
  if(q)list=list.filter(c=>norm(c.front).includes(q)||norm(c.back).includes(q));
  const stopCount=S.cards.filter(c=>c.stop).length;
  $('#chipsRow').innerHTML=`
    <button class="chip" data-f="all" aria-pressed="${S.cardFilter==='all'}">Все · <span class="num">${S.cards.length}</span></button>
    <button class="chip" data-f="nocat" aria-pressed="${S.cardFilter==='nocat'}">Без категории · <span class="num">${nocat.length}</span></button>
    <button class="chip" data-f="stop" aria-pressed="${S.cardFilter==='stop'}">○ Стоп-лист · <span class="num">${stopCount}</span></button>`;
  const empty={stop:'В стоп-листе пусто.<br>Сюда уходят слова, которые вы уже хорошо знаете.',nocat:'Все карточки распределены по категориям.',
    all:q?'Ничего не найдено.':'Карточек пока нет.<br>Нажмите «＋ Карточка», чтобы создать первую.'}[S.cardFilter];
  $('#cardList').innerHTML=list.length?list.map(c=>cardItem(c,st.get(c.id))).join(''):`<div class="empty">${q&&S.cardFilter!=='all'?'Ничего не найдено.':empty}</div>`;
  const v=$('#view');
  v.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{S.cardFilter=b.dataset.f;drawCardList()});
  v.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editCard(b.dataset.edit));
  v.querySelectorAll('[data-stop]').forEach(b=>b.onclick=()=>toggleStop(b.dataset.stop));
}
function cardItem(c,s){
  let pill='';
  if(c.stop)pill='<span class="pill stop">○ в стоп-листе</span>';
  else if(s&&s.last==='bad')pill='<span class="pill bad">✗ недоучено</span>';
  else if(s&&s.last==='ok')pill='<span class="pill ok">✓ выучено</span>';
  const cats=S.cats.filter(k=>k.cardIds.includes(c.id)).length;
  return `<div class="item"><button class="w" data-edit="${c.id}" style="text-align:left"><b>${esc(c.front)}</b><span>${esc(c.back)}</span>
    <span style="margin-top:4px">${pill}${cats?` <span class="pill neutral">категорий: ${cats}</span>`:' <span class="pill neutral">без категории</span>'}</span></button>
    <button class="mark stop" data-stop="${c.id}" aria-label="${c.stop?'Достать из стоп-листа':'В стоп-лист'}" title="${c.stop?'Достать из стоп-листа':'В стоп-лист'}" style="${c.stop?'':'opacity:.45'}">○</button></div>`;
}
async function toggleStop(id){
  const c=byId(S.cards,id);if(!c)return;c.stop=!c.stop;c.u=Date.now();await dbPut('cards',c);
  toast(c.stop?'Отправлено в стоп-лист':'Возвращено в обучение');
  if(S.tab==='cards')drawCardList();
}

/* ---------- Окно одной карточки ---------- */
function editCard(id){
  const c=id?byId(S.cards,id):null;
  const dr=!c?(S.drafts.card||{}):{};
  const myCats=c?S.cats.filter(k=>k.cardIds.includes(c.id)).map(k=>k.id):(dr.cats||[]).filter(i=>byId(S.cats,i));
  const catsHtml=S.cats.length?`<div><label class="f">Категории (<span id="fCatN" class="num">${myCats.length}</span>)</label>
    <div class="catbox" id="fCats">${groupedCats().filter(g=>g.cats.length).map(g=>(S.folders.length?`<div class="cap" style="margin:6px 2px 0">${g.folder?esc(g.folder.name):'Без папки'}</div>`:'')+g.cats.map(k=>`<label class="check compact"><input type="checkbox" value="${k.id}" ${myCats.includes(k.id)?'checked':''}><span class="grow">${esc(k.name)}</span></label>`).join('')).join('')}</div></div>`:'';
  openSheet(`<h2>${c?'Редактировать карточку':'Новая карточка'}</h2>
    <div class="stack">
      <div><label class="f" for="fFront">${esc(S.meta.frontLang)} (лицевая сторона)</label>
        <input type="text" id="fFront" value="${esc(c?c.front:(dr.front||''))}" autocomplete="off" autocapitalize="none">
        <div id="dupWarn"></div>
        <div class="sub" style="margin:6px 0 0">Несколько слов для одного перевода пишите через запятую. В письменном режиме подойдёт любое.</div></div>
      <div><label class="f" for="fBack">Перевод на русском (оборотная сторона)</label>
        <input type="text" id="fBack" value="${esc(c?c.back:(dr.back||''))}" autocomplete="off">
        <div class="sub" style="margin:6px 0 0">Несколько вариантов перевода тоже через запятую.</div></div>
      ${catsHtml}
    </div>`,(el)=>{
    const F=$('#fFront'),B=$('#fBack');clearable(F);clearable(B);
    setTimeout(()=>F.focus(),50);
    const chosen=()=>[...el.querySelectorAll('#fCats input:checked')].map(i=>i.value);
    const checkDup=()=>{const d=findDup(F.value,c?.id);F.classList.toggle('is-dup',!!d);
      $('#dupWarn').innerHTML=d?`<div class="warn">⚠ Такая карточка уже есть: <b>${esc(d.front)}</b> — ${esc(d.back)}</div>`:''};
    const keep=()=>{if(c)return;const n=$('#fCatN');if(n)n.textContent=chosen().length;
      if(!F.value&&!B.value&&!chosen().length)clearDraft('card');else saveDraft('card',{front:F.value,back:B.value,cats:chosen()})};
    F.addEventListener('input',()=>{checkDup();keep()});B.addEventListener('input',keep);
    el.addEventListener('change',e=>{if(e.target.closest('#fCats'))keep()});
    checkDup();
    const save=async(again)=>{
      const front=F.value.trim(),back=B.value.trim();
      if(!front||!back){toast('Заполните обе стороны');return}
      let card=c;
      if(!card){card={id:uid(),front,back,created:Date.now(),stop:false,u:Date.now()};S.cards.push(card)}
      else{card.front=front;card.back=back;card.u=Date.now()}
      await dbPut('cards',card);
      const sel=chosen(),touched=[];
      for(const k of S.cats){
        const has=k.cardIds.includes(card.id),want=sel.includes(k.id);
        if(want&&!has){k.cardIds.push(card.id);touched.push(k)}
        if(!want&&has){k.cardIds=k.cardIds.filter(x=>x!==card.id);touched.push(k)}
      }
      if(touched.length)await dbPutMany('cats',touched);
      toast('Сохранено');
      if(!c&&again){saveDraft('card',{front:'',back:'',cats:sel});render();editCard()}
      else{if(!c)clearDraft('card');finishEdit()}
    };
    $('#fSave').onclick=()=>save(false);
    const n=$('#fSaveNext');if(n)n.onclick=()=>save(true);
    /* Enter: в первом поле переходит ко второму, во втором сохраняет.
       Во время ввода через IME Enter только подтверждает слово. */
    F.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isIME(e)){e.preventDefault();B.focus()}});
    B.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isIME(e)){e.preventDefault();save(!c)}});
    const d=$('#fDel');
    if(d)d.onclick=()=>{
      d.textContent='Точно удалить?';d.onclick=async()=>{
        S.cards=S.cards.filter(x=>x.id!==c.id);await dbDel('cards',c.id);
        const touched=S.cats.filter(k=>k.cardIds.includes(c.id));touched.forEach(k=>k.cardIds=k.cardIds.filter(x=>x!==c.id));
        if(touched.length)await dbPutMany('cats',touched);
        toast('Карточка удалена');finishEdit();
      };
    };
  },c?`<div class="row"><button class="btn grow" id="fSave">Сохранить</button><button class="btn danger" id="fDel">Удалить</button></div>`
    :`<button class="btn block" id="fSave">Сохранить</button><button class="btn soft block" id="fSaveNext">Сохранить и продолжить</button>`);
}

/* ---------- Несколько слов сразу ---------- */
function editMany(){
  const dr=S.drafts.bulk||{};
  let def=(dr.def||[]).filter(i=>byId(S.cats,i));
  const R=(dr.rows&&dr.rows.length?dr.rows:Array.from({length:5},()=>({}))).map(r=>({f:r.f||'',b:r.b||'',cats:r.cats?r.cats.filter(i=>byId(S.cats,i)):null}));
  const existing=new Map();S.cards.forEach(c=>variantKeys(c.front).forEach(k=>existing.set(k,c)));
  const names=(ids)=>ids.map(i=>byId(S.cats,i)?.name).filter(Boolean);
  openSheet(`<h2>Несколько карточек сразу</h2>
    <div class="sub">Слово — перевод = категории. Несколько вариантов пишите через запятую. Enter в поле перевода переходит к следующей строке.</div>
    <div class="stack">
      <div><label class="f">Категории для всех строк</label>
        ${S.cats.length?'<div class="chips" id="defChips" style="max-height:132px;overflow:auto"></div>':'<div class="sub" style="margin:0">Категорий пока нет. Создать их можно во вкладке «Категории».</div>'}</div>
      <div class="stack" id="rows"></div>
      <div class="row"><button class="btn soft grow" id="addRow">＋ Строка</button><button class="btn soft grow" id="addRows">＋ 5 строк</button></div>
    </div>`,(el)=>{
    const rowsBox=$('#rows');
    const persist=()=>{const any=R.some(r=>r.f||r.b||r.cats);
      if(!any&&!def.length)clearDraft('bulk');else saveDraft('bulk',{rows:R.map(r=>({f:r.f,b:r.b,cats:r.cats})),def})};
    const filledCount=()=>R.filter(r=>r.f.trim()&&r.b.trim()).length;
    const upBtn=()=>{const n=filledCount();const b=$('#bSave');b.textContent=n?`Сохранить всё (${n})`:'Сохранить всё';};
    const dupOf=(r)=>{const keys=variantKeys(r.f);if(!keys.length)return null;
      for(const k of keys)if(existing.has(k))return {card:existing.get(k)};
      const idx=R.indexOf(r);
      for(let j=0;j<idx;j++){if(variantKeys(R[j].f).some(k=>keys.includes(k)))return {batch:true}}
      return null};
    const recheck=()=>rowsBox.querySelectorAll('.brow').forEach(el=>{
      const r=el._r,d=dupOf(r),w=el.querySelector('.rwarn');
      el.querySelector('.rf').classList.toggle('is-dup',!!d);
      w.innerHTML=d?`<div class="warn" style="margin:0">⚠ ${d.card?`Уже есть: <b>${esc(d.card.front)}</b> — ${esc(d.card.back)}. Эта строка будет пропущена.`:'Повтор в этом списке. Эта строка будет пропущена.'}</div>`:''});
    const label=(r)=>{const ids=r.cats||def;const n=names(ids).join(', ')||'без категории';return r.cats?('= '+n):('= как у всех: '+n)};
    const chipsFor=(r)=>`<button type="button" class="chip" data-same aria-pressed="${r.cats===null}">как у всех</button>`+catChips(id=>(r.cats||[]).includes(id));
    const addRow=(r,focus)=>{
      const el=document.createElement('div');el.className='brow';el._r=r;
      el.innerHTML=`<div class="in"><input type="text" class="rf" placeholder="${esc(S.meta.frontLang)}" value="${esc(r.f)}" autocomplete="off" autocapitalize="none"><span class="dash">—</span>
        <input type="text" class="rb" placeholder="Перевод" value="${esc(r.b)}" autocomplete="off"><button type="button" class="del" aria-label="Убрать строку">✕</button></div>
        <div class="rwarn"></div>${S.cats.length?'<button type="button" class="catbtn"></button><div class="chips" hidden></div>':''}`;
      const rf=el.querySelector('.rf'),rb=el.querySelector('.rb'),cb=el.querySelector('.catbtn'),ch=el.querySelector('.chips');
      const setLbl=()=>{if(cb)cb.textContent=label(r)};setLbl();el._setLbl=setLbl;
      rf.addEventListener('input',()=>{r.f=rf.value;recheck();upBtn();persist()});
      rb.addEventListener('input',()=>{r.b=rb.value;upBtn();persist()});
      rf.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isIME(e)){e.preventDefault();rb.focus()}});
      rb.addEventListener('keydown',e=>{if(e.key==='Enter'&&!isIME(e)){e.preventDefault();
        let nx=el.nextElementSibling;if(!nx){addRow({f:'',b:'',cats:null},true);nx=el.nextElementSibling}
        nx.querySelector('.rf').focus()}});
      el.querySelector('.del').onclick=()=>{R.splice(R.indexOf(r),1);el.remove();if(!R.length)addRow({f:'',b:'',cats:null});recheck();upBtn();persist()};
      if(cb){cb.onclick=()=>{ch.hidden=!ch.hidden;if(!ch.hidden)ch.innerHTML=chipsFor(r)};
        ch.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
          if(b.hasAttribute('data-same'))r.cats=null;
          else{if(r.cats===null)r.cats=[...def];const id=b.dataset.c;r.cats=r.cats.includes(id)?r.cats.filter(x=>x!==id):[...r.cats,id]}
          ch.innerHTML=chipsFor(r);setLbl();persist()})}
      rowsBox.appendChild(el);
      if(!R.includes(r))R.push(r);
      if(focus)rf.focus();
    };
    R.forEach(r=>addRow(r));recheck();upBtn();
    const defBox=$('#defChips');
    const drawDef=()=>{if(!defBox)return;defBox.innerHTML=catChips(id=>def.includes(id))};
    drawDef();
    if(defBox)defBox.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const id=b.dataset.c;
      def=def.includes(id)?def.filter(x=>x!==id):[...def,id];drawDef();
      rowsBox.querySelectorAll('.brow').forEach(r=>{r._setLbl&&r._setLbl();const ch=r.querySelector('.chips');if(ch&&!ch.hidden)ch.innerHTML=chipsFor(r._r)});persist()});
    $('#addRow').onclick=()=>addRow({f:'',b:'',cats:null},true);
    $('#addRows').onclick=()=>{for(let i=0;i<5;i++)addRow({f:'',b:'',cats:null},i===0)};
    $('#bSave').onclick=async()=>{
      const filled=R.filter(r=>r.f.trim()||r.b.trim());
      const partial=filled.find(r=>!r.f.trim()||!r.b.trim());
      if(partial){const el=[...rowsBox.children].find(x=>x._r===partial);el&&el.scrollIntoView({block:'center'});toast('В одной из строк заполнена только одна сторона');return}
      if(!filled.length){toast('Впишите хотя бы одно слово');return}
      const seen=new Map(existing),created=[],byCat=new Map();let skipped=0;const t=Date.now();
      for(const r of filled){
        const keys=variantKeys(r.f);
        if(keys.some(k=>seen.has(k))){skipped++;continue}
        const card={id:uid(),front:r.f.trim(),back:r.b.trim(),created:t+created.length,stop:false,u:t};
        keys.forEach(k=>seen.set(k,card));created.push(card);
        for(const cid of (r.cats||def)){if(!byCat.has(cid))byCat.set(cid,[]);byCat.get(cid).push(card.id)}
      }
      if(!created.length){toast('Все слова из списка уже есть в пуле');return}
      S.cards.push(...created);await dbPutMany('cards',created);
      const touched=[];for(const [cid,ids] of byCat){const k=byId(S.cats,cid);if(k){k.cardIds.push(...ids);touched.push(k)}}
      if(touched.length)await dbPutMany('cats',touched);
      clearDraft('bulk');closeSheet();
      toast(`Добавлено: ${created.length}`+(skipped?`, пропущено повторов: ${skipped}`:''));render();
    };
    setTimeout(()=>rowsBox.querySelector('.rf')?.focus(),50);
  },`<button class="btn block" id="bSave">Сохранить всё</button>`);
}

/* ---------- Вкладка: категории и папки ---------- */
function viewCats(){
  const v=$('#view');
  const catItem=(k)=>`<button class="item" data-cat="${k.id}" style="text-align:left;width:100%"><div class="w"><b>${esc(k.name)}</b><span class="num">карточек: ${k.cardIds.filter(id=>byId(S.cards,id)).length}</span></div><span style="color:var(--muted);font-size:22px">›</span></button>`;
  const groups=groupedCats();
  const body=groups.map(g=>{
    if(!g.folder){
      if(!g.cats.length)return '';
      return (S.folders.length?'<div class="cap" style="margin:14px 2px 2px">Без папки</div>':'')+`<div class="stack">${g.cats.map(catItem).join('')}</div>`;
    }
    const f=g.folder,open=!S.collapsed.has(f.id);
    return `<div class="stack" style="margin-bottom:12px"><div class="row"><button class="item grow" data-fold="${f.id}" style="text-align:left;background:var(--surface2);box-shadow:none"><span style="font-size:18px;color:var(--accent)">${open?'▾':'▸'}</span><div class="w"><b>${esc(f.name)}</b><span class="num">категорий: ${g.cats.length}</span></div></button>
      <button class="icon-btn" data-editfold="${f.id}" aria-label="Изменить папку" title="Изменить папку">✎</button></div>
      ${open?(g.cats.length?g.cats.map(catItem).join(''):'<div class="sub" style="margin:0 4px">Папка пока пуста. Откройте категорию и выберите эту папку.</div>'):''}</div>`;
  }).join('');
  v.innerHTML=`<div class="row" style="margin-bottom:12px"><button class="btn grow" id="addCat">＋ Категория</button><button class="btn soft grow" id="addFolder">＋ Папка</button></div>
    <div class="sub">Одна карточка может входить в несколько категорий. Категории можно складывать в папки.</div>
    ${S.cats.length||S.folders.length?body:'<div class="empty">Категорий пока нет.<br>Создайте тему, например «Еда» или «Путешествия», и добавьте в неё карточки из общего пула.</div>'}`;
  $('#addCat').onclick=()=>editCat();
  $('#addFolder').onclick=()=>editFolder();
  v.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>editCat(b.dataset.cat));
  v.querySelectorAll('[data-fold]').forEach(b=>b.onclick=()=>{const id=b.dataset.fold;S.collapsed.has(id)?S.collapsed.delete(id):S.collapsed.add(id);viewCats()});
  v.querySelectorAll('[data-editfold]').forEach(b=>b.onclick=()=>editFolder(b.dataset.editfold));
}
function editFolder(id){
  const f=id?byId(S.folders,id):null;
  openSheet(`<h2>${f?'Папка':'Новая папка'}</h2>
    <div><label class="f" for="fdName">Название</label><input type="text" id="fdName" value="${esc(f?.name||'')}" autocomplete="off" placeholder="Например: Глаголы"></div>
    ${f?`<div class="sub" style="margin-top:12px">Категорий в папке: ${S.cats.filter(k=>k.folderId===f.id).length}. При удалении папки категории и карточки останутся, просто окажутся вне папки.</div>`:''}`,
  ()=>{
    clearable($('#fdName'));setTimeout(()=>$('#fdName').focus(),50);

      await saveFolders();closeSheet();toast('Сохранено');render();
    };

}
function editCat(id,defFolder){
  const k=id?byId(S.cats,id):null;
  const sel=new Set(k?k.cardIds.filter(i=>byId(S.cards,i)):[]);
  const sorted=S.cards.slice().sort((a,b)=>a.front.localeCompare(b.front));
  const item=(c,mark,cls)=>`<button type="button" class="pi ${cls||''}" data-id="${c.id}"><span class="t"><b>${esc(c.front)}</b><span>${esc(c.back)}</span></span><span class="m">${mark}</span></button>`;
  openSheet(`<h2>${k?'Категория':'Новая категория'}</h2>
    <div><label class="f" for="cName">Название</label><input type="text" id="cName" value="${esc(k?.name||'')}" autocomplete="off"></div>
    ${S.folders.length?`<div style="margin-top:10px"><label class="f" for="cFolder">Папка</label><select id="cFolder"><option value="">— без папки —</option>${S.folders.map(f=>`<option value="${f.id}" ${(k?k.folderId:defFolder)===f.id?'selected':''}>${esc(f.name)}</option>`).join('')}</select></div>`:''}
    <div class="two" style="margin-top:14px">
      <div><div class="cap">В категории: <span id="cN" class="num"></span></div><div class="plist" id="cLeft"></div></div>
      <div><div class="cap">Все слова: <span class="num">${S.cards.length}</span></div><input type="text" id="cSearch" placeholder="Поиск" autocomplete="off" style="margin-bottom:8px;padding:9px 12px"><div class="plist" id="cPool"></div></div>
    </div>`,(el)=>{
    clearable($('#cName'));clearable($('#cSearch'));
    const left=$('#cLeft'),pool=$('#cPool');
    const drawLeft=()=>{const st=left.scrollTop;const items=sorted.filter(c=>sel.has(c.id));
      left.innerHTML=items.length?items.map(c=>item(c,'✕')).join(''):'<div class="sub" style="margin:4px 2px">Пока пусто. Выберите слова справа.</div>';
      left.scrollTop=st;$('#cN').textContent=sel.size};
    const drawPool=()=>{const q=norm($('#cSearch').value);
      const items=sorted.filter(c=>!q||norm(c.front).includes(q)||norm(c.back).includes(q));
      pool.innerHTML=items.length?items.map(c=>item(c,sel.has(c.id)?'✓':'＋',sel.has(c.id)?'in':'')).join(''):'<div class="sub" style="margin:4px 2px">Ничего нет. Сначала создайте карточки.</div>'};
    drawLeft();drawPool();
    $('#cSearch').addEventListener('input',drawPool);
    pool.addEventListener('click',e=>{const b=e.target.closest('.pi');if(!b)return;const id=b.dataset.id;
      sel.has(id)?sel.delete(id):sel.add(id);
      b.classList.toggle('in',sel.has(id));b.querySelector('.m').textContent=sel.has(id)?'✓':'＋';drawLeft()});
    left.addEventListener('click',e=>{const b=e.target.closest('.pi');if(!b)return;const id=b.dataset.id;sel.delete(id);drawLeft();
      const pb=pool.querySelector(`[data-id="${id}"]`);if(pb){pb.classList.remove('in');pb.querySelector('.m').textContent='＋'}});
    $('#cSave').onclick=async()=>{
      const name=$('#cName').value.trim();if(!name){toast('Введите название');return}
      let cat=k;if(!cat){cat={id:uid(),name,cardIds:[]};S.cats.push(cat)}
      cat.name=name;cat.cardIds=[...sel];const fs=$('#cFolder');if(fs){if(fs.value)cat.folderId=fs.value;else delete cat.folderId}await dbPut('cats',cat);closeSheet();toast('Сохранено');render();
    };
    const d=$('#cDel');
    if(d)d.onclick=()=>{d.textContent='Точно удалить?';d.onclick=async()=>{
      S.cats=S.cats.filter(x=>x.id!==k.id);await dbDel('cats',k.id);closeSheet();toast('Категория удалена (карточки остались в пуле)');render()}};
  },`<div class="row"><button class="btn grow" id="cSave">Сохранить</button>${k?'<button class="btn danger" id="cDel">Удалить</button>':''}</div>`);
}

/* ---------- Резервная копия в файле и перенос между устройствами ---------- */
const fmtDate=(iso)=>{try{return new Date(iso).toLocaleString('ru-RU',{day:'numeric',month:'long',year:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}};
function buildBackup(){
  return {app:'kartochki',v:2,exported:new Date().toISOString(),cards:S.cards,cats:S.cats,folders:S.folders,events:S.events,cycle:S.cycle,
    meta:{frontLang:S.meta.frontLang,count:S.meta.count}};
}
const backupName=()=>`kartochki-kopiya-${dayKey(Date.now())}.json`;
function backupFile(){
  const json=JSON.stringify(buildBackup());
  return {json,blob:new Blob([json],{type:'application/json'}),name:backupName()};
}
async function markBackup(){S.meta.lastBackup=new Date().toISOString();await dbPut('meta',{k:'meta',...S.meta}).catch(()=>{})}
function downloadBackup(){
  const {blob,name}=backupFile();
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.style.display='none';
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),15000);
  markBackup();
  toast(`Файл сохраняется: ${S.cards.length} карточек, ${Math.max(1,Math.round(blob.size/1024))} КБ`);
}

/* объединение: ничего не стирает, новые карточки добавляются, одинаковые не дублируются */
async function mergeData(d){
  const key=(c)=>norm(c.front)+'\u0001'+norm(c.back);
  const cardById=new Map(S.cards.map(c=>[c.id,c])),cardByKey=new Map(S.cards.map(c=>[key(c),c]));
  const idMap=new Map(),newCards=[],changed=new Set();let updated=0;
  for(const ic of d.cards){
    if(!ic||!ic.id||typeof ic.front!=='string'||typeof ic.back!=='string')continue;
    let lc=cardById.get(ic.id)||cardByKey.get(key(ic));
    if(lc){idMap.set(ic.id,lc.id);
      if((ic.u||0)>(lc.u||0)){lc.front=ic.front;lc.back=ic.back;lc.stop=!!ic.stop;lc.u=ic.u;changed.add(lc);updated++}}
    else{const nc={id:ic.id,front:ic.front,back:ic.back,created:ic.created||Date.now(),stop:!!ic.stop};if(ic.u)nc.u=ic.u;
      S.cards.push(nc);newCards.push(nc);cardById.set(nc.id,nc);cardByKey.set(key(nc),nc);idMap.set(ic.id,nc.id)}
  }
  /* папки и категории */
  const fmap=new Map();let newFolders=0;
  const fByName=new Map(S.folders.map(f=>[norm(f.name),f]));
  for(const f of (d.folders||[])){if(!f||!f.id||!f.name)continue;
    let lf=byId(S.folders,f.id)||fByName.get(norm(f.name));
    if(!lf){lf={id:f.id,name:f.name};S.folders.push(lf);fByName.set(norm(lf.name),lf);newFolders++}
    fmap.set(f.id,lf.id)}
  const catTouched=new Set();let newCats=0;
  const catByName=new Map(S.cats.map(k=>[norm(k.name),k]));
  for(const ik of (d.cats||[])){if(!ik||!ik.id||!ik.name)continue;
    let lk=byId(S.cats,ik.id)||catByName.get(norm(ik.name));
    if(!lk){lk={id:ik.id,name:ik.name,cardIds:[]};S.cats.push(lk);catByName.set(norm(lk.name),lk);newCats++;catTouched.add(lk)}
    if(!lk.folderId&&ik.folderId&&fmap.has(ik.folderId)){lk.folderId=fmap.get(ik.folderId);catTouched.add(lk)}
    const have=new Set(lk.cardIds);
    for(const i of (ik.cardIds||[])){const m=idMap.get(i);if(m&&!have.has(m)){lk.cardIds.push(m);have.add(m);catTouched.add(lk)}}
  }
  /* история ответов */
  const haveEv=new Set(S.events.map(e=>e.id)),newEv=[];
  for(const e of (d.events||[])){if(!e||!e.id||haveEv.has(e.id))continue;
    const ne={...e,c:idMap.get(e.c)||e.c};S.events.push(ne);newEv.push(ne);haveEv.add(e.id)}
  /* круги */
  if(d.cycle&&typeof d.cycle==='object'){for(const k of Object.keys(d.cycle)){if(!Array.isArray(d.cycle[k]))continue;
    const cur=new Set(S.cycle[k]||[]);d.cycle[k].forEach(i=>cur.add(idMap.get(i)||i));S.cycle[k]=[...cur]}}
  if(d.meta&&d.meta.frontLang&&S.meta.frontLang==='Иностранный')S.meta.frontLang=d.meta.frontLang;
  await dbPutMany('cards',[...newCards,...changed]);
  if(catTouched.size)await dbPutMany('cats',[...catTouched]);
  if(newEv.length)await dbPutMany('events',newEv);
  await saveFolders();await saveCycle();await dbPut('meta',{k:'meta',...S.meta});
  return {added:newCards.length,updated,cats:newCats,folders:newFolders,events:newEv.length};
}
/* замена: на устройстве остаётся ровно то, что в файле */
async function replaceData(d){
  await dbClear('cards');await dbClear('cats');await dbClear('events');
  await dbPutMany('cards',d.cards);await dbPutMany('cats',d.cats||[]);await dbPutMany('events',d.events||[]);
  S.cards=d.cards;S.cats=d.cats||[];S.events=d.events||[];S.folders=Array.isArray(d.folders)?d.folders:[];await saveFolders();
  S.cycle={classic:[],choice:[],write:[],chain:[],...(d.cycle||{})};await saveCycle();
  if(d.meta){S.meta={...S.meta,frontLang:d.meta.frontLang||S.meta.frontLang};if(typeof d.meta.count==='number'){S.meta.count=d.meta.count;S.setup.count=d.meta.count}}
  await dbPut('meta',{k:'meta',...S.meta});
}
async function readBackupFile(f){
  let d;
  try{d=JSON.parse(await f.text())}catch(e){toast('Не удалось прочитать файл: это не копия приложения');return}
  if(!d||!Array.isArray(d.cards)){toast('В этом файле нет карточек');return}
  openImportPreview(d,f.name);
}
function openImportPreview(d,fname){
  const n=(a)=>Array.isArray(a)?a.length:0;
  openSheet(`<h2>Копия из файла</h2>
    <div class="card"><div style="font-weight:800;overflow-wrap:anywhere">${esc(fname||'файл')}</div>
      <div class="sub" style="margin:4px 0 0">${d.exported?'Создана: '+esc(fmtDate(d.exported))+'. ':''}Карточек: <b class="num">${n(d.cards)}</b>, категорий: <b class="num">${n(d.cats)}</b>, папок: <b class="num">${n(d.folders)}</b>, ответов в статистике: <b class="num">${n(d.events)}</b>.</div>
      <div class="sub" style="margin:4px 0 0">Сейчас на этом устройстве: карточек <b class="num">${S.cards.length}</b>, категорий <b class="num">${S.cats.length}</b>.</div></div>
    <div class="stack" style="margin-top:14px">
      <div class="card"><b>Объединить</b><div class="sub" style="margin:4px 0 10px">Ничего не удаляется. Новые карточки, категории и ответы из файла добавятся, одинаковые карточки не задвоятся. Подходит для переноса между телефоном и компьютером.</div>
        <button class="btn block" id="iMerge">Объединить</button></div>
      <div class="card"><b>Заменить всё</b><div class="sub" style="margin:4px 0 10px">Всё, что есть на этом устройстве, будет стёрто и заменено содержимым файла. Подходит для нового, пустого устройства или восстановления после сбоя.</div>
        <button class="btn danger block" id="iReplace">Заменить всё</button></div>
    </div>`,()=>{
    $('#iMerge').onclick=async()=>{const b=$('#iMerge');b.disabled=true;b.textContent='Объединяю…';
      try{const r=await mergeData(d);closeSheet();render();
        toast(`Добавлено карточек: ${r.added}`+(r.updated?`, обновлено: ${r.updated}`:'')+(r.cats?`, категорий: ${r.cats}`:''))}
      catch(e){console.warn(e);b.disabled=false;b.textContent='Объединить';toast('Не получилось объединить, данные не изменены')}};
    const rp=$('#iReplace');
    rp.onclick=()=>{rp.textContent='Точно заменить всё?';rp.onclick=async()=>{rp.disabled=true;rp.textContent='Заменяю…';
      try{await replaceData(d);applyTheme();closeSheet();render();toast('Данные заменены')}
      catch(e){console.warn(e);rp.disabled=false;rp.textContent='Заменить всё';toast('Не получилось заменить')}}};
  });
}

        b.onclick=async()=>{try{const f2=backupFile();await navigator.share({files:[new File([f2.blob],f2.name,{type:'application/json'})],title:'Копия карточек'});markBackup()}catch(e){if(e&&e.name!=='AbortError')toast('Не удалось отправить, сохраните файл кнопкой выше')}}}}catch(e){}
  });

/* ---------- Вкладка: учить ---------- */
const MODES={classic:'Классика',choice:'Варианты',write:'Письмо',chain:'Все три подряд',daily:'Карточки дня'};
const STAGES=['classic','choice','write'];
S.dailyHow='chain';S.daily=null;
S.setup={sel:new Set(['__all']),side:'front',shuffle:true,stopOnly:false,count:20};
S.mode='classic';

function enterStudy(reset){if(reset||!S.study)S.study={phase:'setup'};render()}
function viewStudy(){
  const v=$('#view');
  const tabs=`<div class="row wrap" style="margin-bottom:14px">${Object.entries(MODES).map(([k,n])=>`<button class="chip" data-mode="${k}" aria-pressed="${S.mode===k}">${n}</button>`).join('')}</div>`;
  if(S.study.phase==='setup'){v.innerHTML=tabs+(S.mode==='daily'?dailySetupHtml():setupHtml());S.mode==='daily'?bindDaily(v):bindSetup(v)}
  else if(S.study.phase==='done'){v.innerHTML=doneHtml();bindDone(v)}
  else{v.innerHTML=runShell();bindRun(v)}
  v.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{S.mode=b.dataset.mode;S.study={phase:'setup'};viewStudy()});
}
const normalCards=()=>S.cards.filter(c=>!c.stop);
function setupHtml(){
  const T=S.setup, stopN=S.cards.filter(c=>c.stop).length;
  const hint={classic:'Смахивайте карточку: вправо, если выучили, влево, если ещё нет. Касание переворачивает карточку.',
    choice:'К слову нужно выбрать верный перевод из вариантов.',write:'К слову нужно ввести ответ самостоятельно.',
    chain:'Выбранные слова проходят три этапа подряд: Классика, Варианты, Письмо. На каждом этапе слова повторяются, пока все не будут выучены.'}[S.mode];
  const catRow=(id,name,n)=>`<label class="check"><input type="checkbox" data-sel="${id}" ${T.sel.has(id)&&!T.stopOnly?'checked':''} ${T.stopOnly?'disabled':''}><span class="grow">${esc(name)}</span><span class="pill neutral num">${n}</span></label>`;
  return `<h2>Что повторяем?</h2><div class="sub">${hint}</div>
    <div class="stack">
      ${catRow('__all','Все карточки',normalCards().length)}
      ${setupCatRows(catRow)}
      <label class="check" style="background:var(--stop-bg)"><input type="checkbox" id="stopOnly" ${T.stopOnly?'checked':''}><span class="grow" style="color:var(--stop);font-weight:800">○ Только стоп-лист</span><span class="pill stop num">${stopN}</span></label>
    </div>
    <h2 style="margin-top:20px">Сколько слов за раз</h2>
    <div class="row wrap">${[10,20,50,0].map(n=>`<button class="chip" data-cnt="${n}" aria-pressed="${T.count===n}">${n||'Все'}</button>`).join('')}
      <input type="text" inputmode="numeric" id="cnt" class="cnt" value="${[10,20,50,0].includes(T.count)?'':T.count}" placeholder="своё" aria-label="Своё количество слов" autocomplete="off"></div>
    <div class="sub" id="cycleInfo" style="margin:10px 0 0"></div>
    <h2 style="margin-top:20px">Показывать сторону</h2>
    <div class="row wrap"><button class="chip" data-side="front" aria-pressed="${T.side==='front'}">${esc(S.meta.frontLang)} → русский</button>
      <button class="chip" data-side="back" aria-pressed="${T.side==='back'}">Русский → ${esc(S.meta.frontLang)}</button></div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="shuf" ${T.shuffle?'checked':''}><span class="grow">Перемешать карточки</span></label>
    <div id="setupMsg" class="sub" style="margin:12px 0 0"></div>
    <button class="btn block" id="go" style="margin-top:10px">Начать</button>`;
}
const countOf=(k)=>k.cardIds.map(id=>byId(S.cards,id)).filter(c=>c&&!c.stop).length;
function setupCatRows(catRow){
  const T=S.setup,multi=S.folders.length>0;
  return groupedCats().filter(g=>g.cats.length).map(g=>{
    const rows=g.cats.map(k=>catRow(k.id,k.name,countOf(k))).join('');
    if(!g.folder)return (multi?'<div class="cap" style="margin:8px 2px 0">Без папки</div>':'')+rows;
    const all=g.cats.every(k=>T.sel.has(k.id));
    return `<label class="check" style="background:var(--surface2);box-shadow:none"><input type="checkbox" data-folder="${g.folder.id}" ${all&&!T.stopOnly?'checked':''} ${T.stopOnly?'disabled':''}><span class="grow"><b>${esc(g.folder.name)}</b> <span style="color:var(--muted)">· вся папка</span></span><span class="pill neutral num">${g.cats.length}</span></label><div class="stack" style="margin-left:14px">${rows}</div>`;
  }).join('');
}
function bindSetup(v){
  const T=S.setup;
  v.querySelectorAll('[data-sel]').forEach(i=>i.onchange=()=>{const id=i.dataset.sel;
    if(i.checked){if(id==='__all')T.sel.clear();else T.sel.delete('__all');T.sel.add(id)}else T.sel.delete(id);viewStudy()});
  v.querySelectorAll('[data-folder]').forEach(i=>i.onchange=()=>{T.sel.delete('__all');
    S.cats.filter(k=>k.folderId===i.dataset.folder).forEach(k=>i.checked?T.sel.add(k.id):T.sel.delete(k.id));viewStudy()});
  const setCount=(n)=>{T.count=n;S.meta.count=n;dbPut('meta',{k:'meta',...S.meta}).catch(()=>{})};
  v.querySelectorAll('[data-cnt]').forEach(b=>b.onclick=()=>{setCount(+b.dataset.cnt);viewStudy()});
  v.querySelector('#cnt').addEventListener('input',e=>{const n=parseInt(e.target.value,10);
    if(n>0){setCount(n);v.querySelectorAll('[data-cnt]').forEach(b=>b.setAttribute('aria-pressed','false'));updCycle()}});
  updCycle();
  v.querySelector('#stopOnly').onchange=(e)=>{T.stopOnly=e.target.checked;viewStudy()};

function baseSelection(){
  const T=S.setup;let cards;
  if(T.sel.has('__all'))cards=normalCards();
  else{const ids=new Set();S.cats.filter(k=>T.sel.has(k.id)).forEach(k=>k.cardIds.forEach(i=>ids.add(i)));cards=S.cards.filter(c=>ids.has(c.id)&&!c.stop)}
  const seen=new Set();return cards.filter(c=>!seen.has(c.id)&&seen.add(c.id));
}
/* «Круг»: выученные в этом режиме слова не повторяются, пока не пройдены все слова выбранных категорий */
function cycleStats(){
  const base=baseSelection(),passed=new Set(S.cycle[S.mode]||[]);
  const done=base.filter(c=>passed.has(c.id)).length;
  return {total:base.length,done,left:base.length-done};
}
const saveCycle=()=>dbPut('meta',{k:'cycle',...S.cycle}).catch(()=>{});
function updCycle(){
  const box=$('#cycleInfo');if(!box)return;const T=S.setup;
  if(T.stopOnly){const n=S.cards.filter(c=>c.stop).length;
    box.textContent=`В стоп-листе слов: ${n}. Круг для стоп-листа не ведётся.`;return}
  const c=cycleStats(),cap=T.count>0?Math.min(T.count,c.left||c.total):(c.left||c.total);
  box.innerHTML=(c.total?`Круг (${MODES[S.mode]}): пройдено ${c.done} из ${c.total}, осталось ${c.left}. `+
    (c.left===0?'Круг завершён, следующий запуск начнёт новый. ':`В эту сессию попадёт слов: ${cap}. `):'Нет слов для повторения. ')+
    (c.done?'<button class="chip" id="resetCycle" style="margin-top:8px">Начать круг заново</button>':'');
  const r=$('#resetCycle');
  if(r)r.onclick=()=>{const ids=new Set(baseSelection().map(x=>x.id));S.cycle[S.mode]=(S.cycle[S.mode]||[]).filter(i=>!ids.has(i));saveCycle();updCycle()};
}
function buildQueue(){
  const T=S.setup;let cards,newCycle=false;
  if(T.stopOnly)cards=S.cards.filter(c=>c.stop);
  else{
    const base=baseSelection(),passed=new Set(S.cycle[S.mode]||[]);
    cards=base.filter(c=>!passed.has(c.id));
    if(!cards.length&&base.length){
      const ids=new Set(base.map(x=>x.id));S.cycle[S.mode]=(S.cycle[S.mode]||[]).filter(i=>!ids.has(i));saveCycle();

async function mark(c,res){

    if(s.daily&&(!s.chain||s.chain.stage===2)&&S.daily&&!S.daily.done.includes(c.id)){S.daily.done.push(c.id);h.daily=true;saveDaily()}

    const arr=h.res==='ok'?s.ok:s.bad;const k=arr.lastIndexOf(h.id);if(k>=0)arr.splice(k,1);
    if(h.cycleKey){S.cycle[h.cycleKey]=(S.cycle[h.cycleKey]||[]).filter(x=>x!==h.id);saveCycle()}
    if(h.daily&&S.daily){S.daily.done=S.daily.done.filter(x=>x!==h.id);saveDaily()}

}

function resetQueue(list){

    dw.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    const k=Math.min(1,Math.abs(dx)/100);br.style.opacity=dx>0?k:0;bl.style.opacity=dx<0?k:0});

/* ---------- Карточки дня ---------- */
const DAILY_RANDOM=30,DAILY_HARD=10;
const saveDaily=()=>dbPut('meta',{k:'daily',...S.daily}).catch(()=>{});
function buildDaily(force){
  const t=dayKey(Date.now());
  if(!force&&S.daily&&S.daily.date===t){S.daily.ids=S.daily.ids.filter(id=>byId(S.cards,id));S.daily.hard=(S.daily.hard||[]).filter(id=>S.daily.ids.includes(id));return S.daily}
  const st=cardStats(),live=S.cards.filter(c=>!c.stop);
  /* трудные: чаще всего «не знаю»/ошибки, плюс последний ответ неверный, минус верные ответы */
  const hard=live.map(c=>{const x=st.get(c.id)||{ok:0,bad:0,last:null};return {c,bad:x.bad,score:x.bad*2+(x.last==='bad'?3:0)-x.ok*0.5}})
    .filter(x=>x.bad>0&&x.score>0).sort((a,b)=>b.score-a.score).slice(0,DAILY_HARD);
  const hardIds=new Set(hard.map(x=>x.c.id));
  const rnd=shuffle(live.filter(c=>!hardIds.has(c.id))).slice(0,DAILY_RANDOM);
  S.daily={date:t,ids:[...hard.map(x=>x.c.id),...rnd.map(c=>c.id)],hard:hard.map(x=>x.c.id),done:[]};
  saveDaily();return S.daily;
}

    <h2 style="margin-top:20px">Показывать сторону</h2>
    <div class="row wrap"><button class="chip" data-side="front" aria-pressed="${T.side==='front'}">${esc(S.meta.frontLang)} → русский</button>
      <button class="chip" data-side="back" aria-pressed="${T.side==='back'}">Русский → ${esc(S.meta.frontLang)}</button></div>
    <label class="check" style="margin-top:14px"><input type="checkbox" id="shuf" ${T.shuffle?'checked':''}><span class="grow">Перемешать карточки</span></label>
    <div id="setupMsg" class="sub" style="margin:12px 0 0">${rem.length?`Осталось пройти сегодня: ${rem.length}.`:'На сегодня всё пройдено. Можно собрать новый набор.'}</div>
    <div class="stack" style="margin-top:10px"><button class="btn block" id="go" ${rem.length?'':'disabled'}>Начать</button>
      <button class="btn soft block" id="reroll">Собрать набор заново</button></div>`;
}
function bindDaily(v){
  const T=S.setup;
  v.querySelectorAll('[data-how]').forEach(b=>b.onclick=()=>{S.dailyHow=b.dataset.how;viewStudy()});
  v.querySelectorAll('[data-side]').forEach(b=>b.onclick=()=>{T.side=b.dataset.side;viewStudy()});
  v.querySelector('#shuf').onchange=(e)=>T.shuffle=e.target.checked;
  v.querySelector('#go').onclick=startSession;
  v.querySelector('#reroll').onclick=()=>{buildDaily(true);toast('Набор собран заново');viewStudy()};
}
function startDaily(){
  const d=buildDaily(),rem=dailyRemaining(d),how=S.dailyHow||'chain';
  if(!rem.length){toast('На сегодня всё пройдено');return}
  if((how==='choice'||how==='chain')&&uniqueAnswers(S.cards).length<2){$('#setupMsg').textContent='Для этого режима нужно хотя бы две разные карточки в пуле.';return}
  const q=S.setup.shuffle?shuffle(rem):rem;
  S.study={phase:'run',queue:q,i:0,ok:[],bad:[],stopped:[],answered:false,hist:[],hint:0,daily:true,
    single:how==='chain'?null:how,chain:how==='chain'?{stage:0,round:1,batch:q.slice(),total:q.length}:null};
  viewStudy();
}
/* ---------- Серия занятий ---------- */
function streakInfo(){
  const days=new Set(S.events.map(e=>dayKey(e.t)));
  const base=new Date();base.setHours(12,0,0,0);
  const key=(off)=>dayKey(base.getTime()-off*864e5);
  const doneToday=days.has(key(0));
  let cur=0,off=doneToday?0:1;
  while(days.has(key(off))){cur++;off++}
  const sorted=[...days].sort();let best=0,run=0,prev=null;
  for(const k of sorted){
    if(prev){const diff=Math.round((new Date(k+'T12:00:00')-new Date(prev+'T12:00:00'))/864e5);run=diff===1?run+1:1}else run=1;
    best=Math.max(best,run);prev=k;
  }
  return {cur,best,doneToday};
}
const flameSvg=(on,size)=>`<svg viewBox="0 0 24 24" width="${size}" height="${size}" aria-hidden="true"><path d="M12 1.8c1.2 3.6 5 5.7 5 10.4a5 5 0 0 1-10 0c0-1.9.7-3.2 1.7-4.3.2 1.4 1 2.2 1.8 2.4C10.2 7.3 10.6 4.5 12 1.8z" fill="${on?'url(#flameGrad)':'var(--line)'}"/></svg>`;
function streakHtml(){
  const {cur,best,doneToday}=streakInfo(),MAX=28;
  const flames=cur?Array.from({length:Math.min(cur,MAX)},()=>flameSvg(true,28)).join('')+(cur>MAX?`<span class="num" style="font-weight:800;color:var(--stop);align-self:center">+${cur-MAX}</span>`:''):flameSvg(false,34);
  const msg=!cur?'Позанимайтесь сегодня, чтобы начать серию.':doneToday?'Сегодня занятие уже засчитано.':'Позанимайтесь сегодня, чтобы не потерять серию.';
  return `<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="flameGrad" x1="0" y1="1" x2="0" y2="0"><stop offset="0" style="stop-color:var(--stop)"/><stop offset="1" stop-color="#ffd166"/></linearGradient></defs></svg>
    <div class="card" style="margin-bottom:16px"><div class="row" style="align-items:flex-end"><div class="grow"><b class="num" style="font-family:var(--font-display);font-size:40px;line-height:1">${cur}</b>
      <span style="font-weight:800;color:var(--muted)"> ${cur%10===1&&cur%100!==11?'день':(cur%10>=2&&cur%10<=4&&(cur%100<10||cur%100>=20))?'дня':'дней'} подряд</span></div>
      <span class="pill neutral">рекорд: <span class="num">${best}</span></span></div>
      <div style="display:flex;flex-wrap:wrap;gap:2px;margin:10px 0 6px">${flames}</div>
      <div class="sub" style="margin:0">${msg}</div></div>`;
}
/* ---------- Вкладка: статистика ---------- */
function viewStats(){
  const v=$('#view'),st=cardStats(),today=dayKey(Date.now());
  const learnedByDay=new Map(),answersByDay=new Map();
  for(const e of S.events){const d=dayKey(e.t);answersByDay.set(d,(answersByDay.get(d)||0)+1);
    if(e.r==='ok'){if(!learnedByDay.has(d))learnedByDay.set(d,new Set());learnedByDay.get(d).add(e.c)}}
  const days=[];for(let i=6;i>=0;i--){const t=Date.now()-i*864e5;const k=dayKey(t);
    days.push({k,label:new Date(t).toLocaleDateString('ru-RU',{weekday:'short'}),n:(learnedByDay.get(k)||new Set()).size})}
  const max=Math.max(1,...days.map(d=>d.n));
  const rows=[...st.entries()].map(([id,s])=>({c:byId(S.cards,id),...s})).filter(r=>r.c);
  const forgot=rows.filter(r=>r.bad>0).sort((a,b)=>b.bad-a.bad||(b.bad/(b.bad+b.ok))-(a.bad/(a.bad+a.ok))).slice(0,10);
  const perfect=rows.filter(r=>r.ok>0&&r.bad===0).sort((a,b)=>b.ok-a.ok).slice(0,10);
  const maxBad=Math.max(1,...forgot.map(r=>r.bad)),maxOk=Math.max(1,...perfect.map(r=>r.ok));
  const line=(r,val,max,color,mark)=>`<div class="item"><div class="w"><b>${esc(r.c.front)}</b><span>${esc(r.c.back)}</span>
    <div class="bar-row" style="margin-top:6px"><div class="bar-track"><i style="width:${Math.max(6,val/max*100)}%;background:${color}"></i></div><span class="num" style="font-weight:800;color:${color}">${mark} ${val}</span></div></div></div>`;
  v.innerHTML=streakHtml()+`<div class="kpi">
      <div class="card"><b class="num" style="color:var(--ok)">${(learnedByDay.get(today)||new Set()).size}</b><span>выучено сегодня</span></div>
      <div class="card"><b class="num">${answersByDay.get(today)||0}</b><span>ответов сегодня</span></div>
      <div class="card"><b class="num" style="color:var(--stop)">${S.cards.filter(c=>c.stop).length}</b><span>в стоп-листе</span></div></div>
    <h2 style="margin-top:20px">Выучено за 7 дней</h2>
    <div class="card"><div class="spark">${days.map(d=>`<div><span class="num" style="font-weight:800;color:var(--fg)">${d.n}</span><i style="height:${Math.max(3,d.n/max*58)}px"></i><span>${esc(d.label)}</span></div>`).join('')}</div></div>
    <h2 style="margin-top:20px">Чаще всего забываются</h2><div class="sub">Карточки с наибольшим числом неверных ответов.</div>
    <div class="stack">${forgot.length?forgot.map(r=>line(r,r.bad,maxBad,'var(--bad)','✗')).join(''):'<div class="empty">Пока ни одной ошибки.</div>'}</div>
    <h2 style="margin-top:20px">Всегда выучены</h2><div class="sub">Правильные ответы подряд, без единой ошибки.</div>
    <div class="stack">${perfect.length?perfect.map(r=>line(r,r.ok,maxOk,'var(--ok)','✓')).join(''):'<div class="empty">Появятся после первых повторений.</div>'}</div>`;
}

/* ---------- Каркас ---------- */
const TABS=[
 ['cards','Карточки','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="14" height="14" rx="3"/><path d="M7 3h11a3 3 0 0 1 3 3v11"/></svg>'],
 ['cats','Категории','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>'],
 ['study','Учить','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>'],
 ['stats','Статистика','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>']];
const TITLES={cards:'Карточки',cats:'Категории',study:'Учить',stats:'Статистика'};
function renderTabs(){
  $('#tabs').innerHTML=TABS.map(([id,n,ic])=>`<button role="tab" data-t="${id}" aria-selected="${S.tab===id}">${ic}<span>${n}</span></button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    const same=S.tab===b.dataset.t;S.tab=b.dataset.t;
    if(S.tab==='study')enterStudy(true);else render();
    if(!same)scrollTo(0,0);
  });
}
function render(){
  $('#title').textContent=TITLES[S.tab];renderTabs();
  if(S.tab==='cards')viewCards();
  else if(S.tab==='cats')viewCats();
  else if(S.tab==='study'){if(!S.study)S.study={phase:'setup'};viewStudy()}
  else viewStats();
}

/* ---------- Запуск ---------- */
const SAMPLE=[['apple','яблоко'],['bread','хлеб'],['cheese','сыр'],['milk','молоко'],['ticket','билет'],['luggage','багаж'],['airport','аэропорт'],['hotel','гостиница']];
async function init(){
  $('#btnTheme').onclick=cycleTheme;$('#btnMenu').onclick=openMenu;
  await openDB();
  try{
    S.cards=await dbAll('cards');S.cats=await dbAll('cats');S.events=await dbAll('events');
    const metaAll=await dbAll('meta');
    const m=metaAll.find(x=>x.k==='meta');if(m){const{k,...rest}=m;S.meta={...S.meta,...rest}}
    const dr=metaAll.find(x=>x.k==='drafts');if(dr){const{k,...rest}=dr;S.drafts=rest}
    const cy=metaAll.find(x=>x.k==='cycle');if(cy){const{k,...rest}=cy;S.cycle={classic:[],choice:[],write:[],chain:[],...rest}}
    const dl=metaAll.find(x=>x.k==='daily');if(dl){const{k,...rest}=dl;S.daily=rest}
    const fo=metaAll.find(x=>x.k==='folders');if(fo&&Array.isArray(fo.list))S.folders=fo.list
    if(typeof S.meta.count==='number')S.setup.count=S.meta.count;
    if(!S.meta.seeded&&!S.cards.length){
      /* примеры при первом запуске; их можно удалить */
      const t=Date.now();
      S.cards=SAMPLE.map(([f,b],i)=>({id:uid(),front:f,back:b,created:t-i,stop:false}));
      S.cats=[{id:uid(),name:'Еда (пример)',cardIds:S.cards.slice(0,4).map(c=>c.id)},{id:uid(),name:'Путешествия (пример)',cardIds:S.cards.slice(4).map(c=>c.id)}];
      await dbPutMany('cards',S.cards);await dbPutMany('cats',S.cats);
    }
    S.meta.seeded=true;await dbPut('meta',{k:'meta',...S.meta});
  }catch(e){console.warn(e)}
  applyTheme();render();
  if(memMode)setTimeout(()=>toast('Хранилище недоступно: данные сохранятся только до закрытия страницы'),600);
}
init();

</script>
